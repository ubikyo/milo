# CI/CD Milo — build on a hosted agent, deployment to the Ubuntu VM via a
# self-hosted agent.
#
# Deployment is triggered on every push to dev and on a version tag
# (v1.0.0, v1.1.0…). Each deployment waits for a manual approval, set on the
# "milo-production" environment in Azure DevOps (Approvals and checks).

trigger:
  branches:
    include:
      - main
      - dev
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: "20.x"
  # Paths on the VM
  apiDir: /opt/milo/server
  webDir: /var/www/milo
  dbDir: /var/lib/milo
  dbPath: /var/lib/milo/data.db

stages:
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: Build & contrôles
    jobs:
      - job: build
        displayName: Client + serveur
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          # A single install: the repository is an npm workspace
          # (shared + server + client).
          - script: npm ci
            displayName: install

          # --- Checks ---
          # Types are checked across the three packages at once; an
          # inconsistency between what the server returns and what the client
          # expects is a compile error, not a surprise at
          # runtime.
          - script: npm run typecheck
            displayName: typage (tsc)
          - script: npm run lint
            displayName: lint (eslint)

          # --- Build ---
          - script: npm run build
            displayName: build

          # --- Server: dry-run startup on the deployed package ---
          - script: node scripts/package-api.mjs "$(Build.ArtifactStagingDirectory)/api"
            displayName: empaquetage api
          - script: |
              set -e
              cd "$(Build.ArtifactStagingDirectory)/api"
              npm install --omit=dev --no-audit --no-fund
              MILO_DB_PATH="/tmp/milo-smoke/smoke.db" PORT=3999 node server.mjs &
              pid=$!
              code=""
              for i in {1..20}; do
                sleep 0.5
                code=`curl -s -o /dev/null -w '%{http_code}' http://localhost:3999/api/auth/setup || true`
                [ "$code" = "200" ] && break
              done
              kill $pid
              rm -rf node_modules package-lock.json
              [ "$code" = "200" ] || { echo "L'API ne répond pas (code=$code)"; exit 1; }
              echo "Démarrage à blanc OK"
            displayName: serveur — démarrage à blanc

          # --- Artifacts ---
          - publish: client/dist
            artifact: web
            displayName: artefact web
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api
            displayName: artefact api

  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: Déploiement sur la VM
    dependsOn: Build
    # On a push to dev or on a version tag, never on a pull request
    condition: |
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/dev'),
          startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
        )
      )
    jobs:
      - deployment: vm
        displayName: VM Ubuntu
        pool:
          name: Milo-VM # pool containing the self-hosted agent installed on the VM
        environment: milo-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: web
                - download: current
                  artifact: api

                - script: |
                    set -euo pipefail
                    sudo mkdir -p "$(webDir)" "$(apiDir)" "$(dbDir)"

                    # Frontend: replace the contents (--delete) since these are
                    # files versioned by hash.
                    sudo rsync -a --delete "$(Pipeline.Workspace)/web/" "$(webDir)/"

                    # API: replace the code, never the database (it is in
                    # $(dbPath), outside the deployed folder).
                    sudo rsync -a --delete \
                      --exclude node_modules \
                      "$(Pipeline.Workspace)/api/" "$(apiDir)/"
                  displayName: copie des fichiers

                - script: |
                    set -euo pipefail
                    # better-sqlite3 is compiled here, on the target VM.
                    # The artifact manifest pins the exact versions
                    # resolved at build time: "install" is as reproducible here
                    # as "ci" used to be.
                    cd "$(apiDir)"
                    sudo npm install --omit=dev --no-audit --no-fund
                    sudo chown -R milo:milo "$(apiDir)" "$(dbDir)"
                  displayName: dépendances de production

                - script: |
                    set -euo pipefail
                    sudo systemctl restart milo-api
                    sudo systemctl is-active --quiet milo-api
                    sudo nginx -t
                    sudo systemctl reload nginx
                  displayName: redémarrage des services

                - script: |
                    set -euo pipefail
                    code=""
                    for i in {1..20}; do
                      sleep 1
                      code=`curl -s -o /dev/null -w '%{http_code}' http://localhost/api/auth/setup || true`
                      [ "$code" = "200" ] && break
                    done
                    [ "$code" = "200" ] || { sudo journalctl -u milo-api -n 50 --no-pager; exit 1; }
                    echo "Milo répond (code=$code)"
                  displayName: contrôle de santé
