# CI/CD Milo — build sur agent hébergé, déploiement sur la VM Ubuntu via un
# agent self-hosted.
#
# Le déploiement se déclenche uniquement sur un tag de version (v1.0.0, v1.1.0…),
# conformément au fonctionnement « à chaque nouvelle release ».

trigger:
  branches:
    include:
      - main
      - dev
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: "20.x"
  # Chemins sur la VM
  apiDir: /opt/milo/server
  webDir: /var/www/milo
  dbDir: /var/lib/milo
  dbPath: /var/lib/milo/data.db

stages:
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: Build & contrôles
    jobs:
      - job: build
        displayName: Client + serveur
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          # Un seul install : le dépôt est un espace de travail npm
          # (shared + server + client).
          - script: npm ci
            displayName: install

          # --- Contrôles ---
          # Le typage est vérifié sur les trois paquets d'un coup ; une
          # incohérence entre ce que le serveur renvoie et ce que le client
          # attend est une erreur de compilation, plus une surprise à
          # l'exécution.
          - script: npm run typecheck
            displayName: typage (tsc)
          - script: npm run lint
            displayName: lint (eslint)

          # --- Build ---
          - script: npm run build
            displayName: build

          # --- Serveur : démarrage à blanc sur le paquet déployé ---
          - script: node scripts/package-api.mjs "$(Build.ArtifactStagingDirectory)/api"
            displayName: empaquetage api
          - script: |
              set -e
              cd "$(Build.ArtifactStagingDirectory)/api"
              npm install --omit=dev --no-audit --no-fund
              MILO_DB_PATH="/tmp/milo-smoke/smoke.db" PORT=3999 node server.mjs &
              pid=$!
              code=""
              for i in {1..20}; do
                sleep 0.5
                code=`curl -s -o /dev/null -w '%{http_code}' http://localhost:3999/api/auth/setup || true`
                [ "$code" = "200" ] && break
              done
              kill $pid
              rm -rf node_modules package-lock.json
              [ "$code" = "200" ] || { echo "L'API ne répond pas (code=$code)"; exit 1; }
              echo "Démarrage à blanc OK"
            displayName: serveur — démarrage à blanc

          # --- Artefacts ---
          - publish: client/dist
            artifact: web
            displayName: artefact web
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api
            displayName: artefact api

  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: Déploiement sur la VM
    dependsOn: Build
    # Uniquement sur un tag de version
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - deployment: vm
        displayName: VM Ubuntu
        pool:
          name: Milo-VM # pool contenant l'agent self-hosted installé sur la VM
        environment: milo-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: web
                - download: current
                  artifact: api

                - script: |
                    set -euo pipefail
                    sudo mkdir -p "$(webDir)" "$(apiDir)" "$(dbDir)"

                    # Frontend : on remplace le contenu (--delete) car ce sont
                    # des fichiers versionnés par hash.
                    sudo rsync -a --delete "$(Pipeline.Workspace)/web/" "$(webDir)/"

                    # API : on remplace le code, jamais la base (elle est dans
                    # $(dbPath), hors du dossier déployé).
                    sudo rsync -a --delete \
                      --exclude node_modules \
                      "$(Pipeline.Workspace)/api/" "$(apiDir)/"
                  displayName: copie des fichiers

                - script: |
                    set -euo pipefail
                    # better-sqlite3 est compilé ici, sur la VM cible.
                    # Le manifeste de l'artefact fige les versions exactes
                    # résolues au build : « install » y est aussi reproductible
                    # que « ci » l'était.
                    cd "$(apiDir)"
                    sudo npm install --omit=dev --no-audit --no-fund
                    sudo chown -R milo:milo "$(apiDir)" "$(dbDir)"
                  displayName: dépendances de production

                - script: |
                    set -euo pipefail
                    sudo systemctl restart milo-api
                    sudo systemctl is-active --quiet milo-api
                    sudo nginx -t
                    sudo systemctl reload nginx
                  displayName: redémarrage des services

                - script: |
                    set -euo pipefail
                    code=""
                    for i in {1..20}; do
                      sleep 1
                      code=`curl -s -o /dev/null -w '%{http_code}' http://localhost/api/auth/setup || true`
                      [ "$code" = "200" ] && break
                    done
                    [ "$code" = "200" ] || { sudo journalctl -u milo-api -n 50 --no-pager; exit 1; }
                    echo "Milo répond (code=$code)"
                  displayName: contrôle de santé
