<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Milo</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1a1b1e; --fg: #ededed; --muted: #9a9a9a; } }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px; padding: 24px;
        box-sizing: border-box; background: var(--bg); color: var(--fg);
        font-family: -apple-system, system-ui, sans-serif; text-align: center;
      }
      p { margin: 0; color: var(--muted); }
      button {
        margin-top: 8px; padding: 10px 20px; border: 0; border-radius: 8px;
        background: #228be6; color: #fff; font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Milo est injoignable</h1>
    <p>Vérifiez votre connexion, puis réessayez.</p>
    <button onclick="location.href = window.MILO_URL">Réessayer</button>
    <script src="milo-url.js"></script>
  </body>
</html>
