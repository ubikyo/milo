# /etc/nginx/sites-available/milo
# The front end and the API are served from the same origin: the client's
# relative /api calls work without CORS or an environment variable.

server {
    listen 80;
    server_name milo.example.fr; # <- replace

    root /var/www/milo;
    index index.html;

    # React app: all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite assets are versioned by hash: long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        # Files uploaded to cards go through here. Without this line,
        # nginx rejects any body over one megabyte before the API even
        # sees it: so it must be given the same limit as the server
        # (server/src/lib/media.ts), a notch above for the envelope.
        client_max_body_size 26m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
