# /etc/nginx/sites-available/milo
# Le front et l'API sont servis sur la même origine : l'appel relatif /api du
# client fonctionne sans CORS ni variable d'environnement.

server {
    listen 80;
    server_name milo.example.fr; # <- à remplacer

    root /var/www/milo;
    index index.html;

    # Application React : toutes les routes retombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets Vite sont versionnés par hash : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
