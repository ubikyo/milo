# /etc/nginx/sites-available/milo  (then: ln -s ../sites-available/milo /etc/nginx/sites-enabled/)
# Static client in /var/www/milo, API on 127.0.0.1:3001.
# Replace milo.example.fr with the real name; certbot adds the HTTPS part.

server {
    listen 80;
    server_name milo.example.fr;

    root /var/www/milo;
    index index.html;

    # Backup restore uploads an archive of up to 512 MB (routes/backup.ts).
    client_max_body_size 512m;

    location / {
        try_files $uri /index.html;
    }

    # Hashed files: cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events: no buffering, a long timeout.
    location = /api/events {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # WebSocket of the Milo Proxy services: see nginx-proxy-socket.conf.
}
