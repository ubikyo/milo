# To add to Milo's nginx "server { … }" block (the HTTPS one), next to the
# "location /api" block: the WebSocket the Milo Proxy services open
# (ressources/proxy/PROTOCOL.md). An exact "location =" wins over "/api".
#
# The socket is authenticated by the proxy's token: no basic authentication
# here, nor any other access rule that would apply to "/api".
location = /api/proxy/socket {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pings go both ways every 15 s: well within this.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
